[project]
name = "lucio-shorts-ml"
version = "0.1.0"
description = "Parti ML della pipeline shorts (trascrizione, separazione voce, segnali audio)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "parakeet-mlx",
  "demucs",
  "torch",
  "soundfile",
  "transformers",
  "scipy",
  "opencv-python<5",
  "mlx-vlm>=0.7.4,<0.8",
  "yt-dlp",
  "torchaudio>=2.11.1",
  "spafe>=0.3.3",
  "shazamio>=0.9.0",
]

[tool.uv]
package = false
